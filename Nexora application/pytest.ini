[pytest]
testpaths = tests
addopts = -ra --strict-markers --tb=short -q
markers =
    real: real-network tests (require internet; gated by RUN_REAL=1)
    slow: >5s tests
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning:scrapy.*
    ignore::DeprecationWarning:twisted.*
